services:
  # Message Broker (RabbitMQ with Management Plugin)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hostel_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - hostel_net
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping || rabbitmqctl status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # AI/NLP Embedding Service
  embedding-service:
    build:
      context: ./embedding_service
    container_name: hostel_embedding_service
    restart: always
    environment:
      - PORT=5000
    ports:
      - "5000:5000"
    networks:
      - hostel_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend Application (Spring Boot)
  backend:
    build:
      context: ./Hostel_hub_backend
    container_name: hostel_backend
    restart: always
    environment:
      - PORT=8080
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - SMTP_USERNAME=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - EMBEDDING_SERVICE_URL=${EMBEDDING_SERVICE_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - ./Hostel_hub_backend/uploads:/app/uploads
    networks:
      - hostel_net
    depends_on:
      rabbitmq:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Frontend Application (React + Vite served via Nginx)
  frontend:
    build:
      context: ./Hostel_hub_frontend
      args:
        - VITE_API_URL=${BACKEND_URL}
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    container_name: hostel_frontend
    restart: always
    ports:
      - "3000:3000"
    networks:
      - hostel_net
    depends_on:
      backend:
        condition: service_healthy

networks:
  hostel_net:
    driver: bridge

volumes:
  rabbitmq_data:

